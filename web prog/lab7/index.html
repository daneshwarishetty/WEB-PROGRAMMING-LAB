<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 7 - JavaScript Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <header class="calculator-header">
      <p class="eyebrow">LAB 7 · JAVASCRIPT</p>
      <h1>Calculator</h1>
      <p class="subtitle">Perform basic mathematical calculations</p>
    </header>

    <section class="display" aria-live="polite">
      <div id="expression" class="expression"></div>
      <output id="result" class="result" aria-label="Calculator display">0</output>
    </section>

    <section class="keys" aria-label="Calculator keys">
      <button class="key utility" data-action="clear">AC</button>
      <button class="key utility" data-action="delete" aria-label="Delete last digit">⌫</button>
      <button class="key utility" data-action="sign">±</button>
      <button class="key operator" data-operator="÷">÷</button>

      <button class="key" data-number="7">7</button>
      <button class="key" data-number="8">8</button>
      <button class="key" data-number="9">9</button>
      <button class="key operator" data-operator="×">×</button>

      <button class="key" data-number="4">4</button>
      <button class="key" data-number="5">5</button>
      <button class="key" data-number="6">6</button>
      <button class="key operator" data-operator="−">−</button>

      <button class="key" data-number="1">1</button>
      <button class="key" data-number="2">2</button>
      <button class="key" data-number="3">3</button>
      <button class="key operator" data-operator="+">+</button>

      <button class="key utility" data-action="percent">%</button>
      <button class="key" data-number="0">0</button>
      <button class="key" data-action="decimal">.</button>
      <button class="key equals" data-action="equals">=</button>
    </section>

    <p id="message" class="message">Use the buttons or your keyboard.</p>
    <footer>Built using HTML, CSS and JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
