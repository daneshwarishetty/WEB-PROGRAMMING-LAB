<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 8 - User Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="page-header">
      <p class="eyebrow">LAB 8 · HTML FORMS & JAVASCRIPT</p>
      <h1>User Information Form</h1>
      <p>Enter your details below to create your profile.</p>
    </header>

    <form id="userForm" class="form-card" novalidate>
      <div class="form-grid">
        <div class="field full">
          <label for="name">Full Name <span>*</span></label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="name" required>
        </div>

        <fieldset class="field full gender-field">
          <legend>Gender <span>*</span></legend>
          <div class="radio-options">
            <label class="radio-label"><input type="radio" name="gender" value="Male" required> Male</label>
            <label class="radio-label"><input type="radio" name="gender" value="Female"> Female</label>
            <label class="radio-label"><input type="radio" name="gender" value="Other"> Other</label>
            <label class="radio-label"><input type="radio" name="gender" value="Prefer not to say"> Prefer not to say</label>
          </div>
        </fieldset>

        <div class="field">
          <label for="mobile">Mobile Number <span>*</span></label>
          <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" inputmode="numeric" maxlength="10" required>
          <small>Enter a valid 10-digit Indian mobile number.</small>
        </div>

        <div class="field">
          <label for="email">Email ID <span>*</span></label>
          <input type="email" id="email" name="email" placeholder="name@example.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="city">City <span>*</span></label>
          <input type="text" id="city" name="city" placeholder="Enter your city" autocomplete="address-level2" required>
        </div>

        <div class="field">
          <label for="state">State <span>*</span></label>
          <input type="text" id="state" name="state" placeholder="Enter your state" autocomplete="address-level1" required>
        </div>

        <div class="field full">
          <label for="country">Country <span>*</span></label>
          <select id="country" name="country" required>
            <option value="">Select your country</option>
            <option>India</option>
            <option>Nepal</option>
            <option>United States</option>
            <option>United Kingdom</option>
            <option>Canada</option>
            <option>Australia</option>
            <option>Other</option>
          </select>
        </div>
      </div>

      <p id="errorMessage" class="error-message" role="alert"></p>
      <button type="submit" class="submit-btn">Submit Information <span aria-hidden="true">→</span></button>
      <p class="form-note">Fields marked with * are required.</p>
    </form>
    <footer>Created using HTML, CSS and JavaScript</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
