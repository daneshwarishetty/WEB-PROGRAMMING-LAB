<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to Book World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="content-page">
  <main class="welcome">
    <div class="eyebrow">DISCOVER • READ • IMAGINE</div>
    <h1>Welcome to <span>Book World</span></h1>
    <p class="lead">A little place for curious minds and lifelong readers.</p>
    <div class="welcome-card">
      <div class="book-stack">📚</div>
      <h2>Explore our book collection</h2>
      <p>Select any book from the list on the left to view its author, genre and a short description.</p>
      <p class="tip">New adventures are only a page away.</p>
    </div>
  </main>
</body>
</html>
