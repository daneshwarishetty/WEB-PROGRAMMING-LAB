<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Danu's Book Collection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="page-header">
    <h1>Danu's Book Collection</h1>
  </header>

  <main class="home-layout">
    <section class="book-menu" aria-labelledby="book-list-heading">
      <h2 id="book-list-heading">Books List</h2>
      <ul id="book-list" class="link-list"></ul>
    </section>

    <section class="collection" aria-label="Book covers">
      <div id="cover-gallery" class="cover-gallery">
        <p class="loading">Loading book covers…</p>
      </div>
    </section>
  </main>

  <footer>Book Information </footer>
  <script src="script.js"></script>
</body>
</html>
