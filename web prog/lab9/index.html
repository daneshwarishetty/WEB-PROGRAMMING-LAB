<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 9 - Read XML Data</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">WEB PROGRAMMING · LAB 9</p>
      <h1>XML Data Viewer</h1>
      <p class="subtitle">Read data from an XML file and display it in a table.</p>
    </header>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2>Book records</h2>
          <p id="status" class="status" role="status">Loading XML data…</p>
        </div>
        <button id="reloadBtn" type="button">Reload data</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Book ID</th>
              <th scope="col">Title</th>
              <th scope="col">Price (₹)</th>
            </tr>
          </thead>
          <tbody id="bookTableBody">
            <tr><td colspan="3" class="empty">Loading records…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
    <footer>Data is loaded from <code>books.xml</code> using JavaScript Fetch API and DOMParser.</footer>
  </main>
</body>
</html>
